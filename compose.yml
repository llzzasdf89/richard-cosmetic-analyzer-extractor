services:
  app:
    image: ccr.ccs.tencentyun.com/richard-lee/richard-cosmetic-analyzer-extractor:v1.0.0
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

networks:
  internal: