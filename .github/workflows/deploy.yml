name: Deploy

on:
  push:
    branches: [main]

env:
  CCR_REGISTRY: ccr.ccs.tencentyun.com
  CCR_REPO: richard-lee/richard-cosmetic-analyzer-extractor

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Tencent CCR
        run: |
          echo ${{ secrets.CCR_PASSWORD }} | docker login $CCR_REGISTRY \
            --username ${{ secrets.CCR_USERNAME }} \
            --password-stdin

      - name: Build and push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build -t $CCR_REGISTRY/$CCR_REPO:$IMAGE_TAG .
          docker build -t $CCR_REGISTRY/$CCR_REPO:latest .
          docker push $CCR_REGISTRY/$CCR_REPO:$IMAGE_TAG
          docker push $CCR_REGISTRY/$CCR_REPO:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.CCR_REGISTRY }}/${{ env.CCR_REPO }}:latest
            cd /app
            docker compose up -d