services:
  app:
    image: ccr.ccs.tencentyun.com/richard-lee/richard-cosmetic-analyzer-extractor:v1.0.0
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    volumes:
      - /var/log/richard-app:/app/logs   # 持久化应用日志
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/richard-nginx:/var/log/nginx  # 持久化 Nginx 日志
    depends_on:
      - app
    networks:
      - internal

networks:
  internal: